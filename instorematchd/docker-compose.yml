# 用 Docker 跑 instorematchd（不用管 Python 环境）
#
#   HOST_OVERRIDE=你的域名或公网IP docker compose up -d --build
#
# 不设 HOST_OVERRIDE 的话默认 example.com，客户端会连不上中继。
services:
  instorematchd:
    build: .
    image: instorematchd:latest
    container_name: instorematchd
    restart: unless-stopped
    ports:
      - "${LOBBY_PORT:-20100}:20100"
      - "${RELAY_PORT:-20101}:20101"
    environment:
      # 想用 /admin 看未打码的完整信息，就跑的时候带上 token：
      #   IMD_ADMIN_TOKEN=你的token docker compose up -d
      - IMD_ADMIN_TOKEN=${IMD_ADMIN_TOKEN:-}
    command:
      - --host-override
      - "${HOST_OVERRIDE:-example.com}"
      - --lobby-port
      - "20100"
      - --relay-port
      - "20101"
