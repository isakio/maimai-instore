# 用 Docker 跑 nyanlinkd（不用管 Python 环境）
#
#   HOST_OVERRIDE=你的域名或公网IP docker compose up -d --build
#
# 不设 HOST_OVERRIDE 的话默认 example.com，客户端会连不上中继。
services:
  nyanlinkd:
    build: .
    image: nyanlinkd:latest
    container_name: nyanlinkd
    restart: unless-stopped
    ports:
      - "${LOBBY_PORT:-20100}:20100"
      - "${RELAY_PORT:-20101}:20101"
    command:
      - --host-override
      - "${HOST_OVERRIDE:-example.com}"
      - --lobby-port
      - "20100"
      - --relay-port
      - "20101"
